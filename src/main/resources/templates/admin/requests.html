<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">

    <h1 class="mb-4">Quản lý yêu cầu cứu trợ</h1>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nạn nhân</th>
                    <th>Địa điểm</th>
                    <th>Loại nhu cầu</th>
                    <th>Số người</th>
                    <th>Mức độ khẩn cấp</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th class="text-center">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${requests}">
                    <td th:text="${req.id}"></td>
                    <td th:text="${req.victim.fullName}"></td>
                    <td th:text="${req.location}"></td>
                    <td th:text="${req.needType}"></td>
                    <td th:text="${req.numberOfPeople}"></td>
                    <td th:text="${req.urgencyLevel}"></td>
                    <td>
                        <th:block th:replace="~{fragments/status-badge :: badge(${req.status})}"></th:block>
                    </td>
                    <td th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-center">
                        <!-- Nút Hủy CHỈ hiện khi status không phải CONFIRMED và không phải CANCELLED -->
                        <form th:if="${req.status.name() != 'CONFIRMED' and req.status.name() != 'CANCELLED'}"
                              th:action="@{/admin/requests/{id}/cancel(id=${req.id})}"
                              method="post"
                              onsubmit="return confirm('Bạn có chắc muốn hủy yêu cầu #' + /*[[${req.id}]]*/ '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Hủy</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="9" class="text-center text-muted">Không có yêu cầu nào.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
