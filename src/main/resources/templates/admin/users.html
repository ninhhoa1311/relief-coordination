<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">

    <h1 class="mb-4">Quản lý tài khoản</h1>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <!-- Nav tabs -->
    <ul class="nav nav-tabs mb-4" id="accountTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <a class="nav-link" th:classappend="${currentTab == 'victim'} ? 'active fw-bold' : ''"
               th:href="@{/admin/users(tab='victim')}">
                Victim (<span th:text="${#lists.size(victims)}">0</span>)
            </a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link" th:classappend="${currentTab == 'rescuer'} ? 'active fw-bold' : ''"
               th:href="@{/admin/users(tab='rescuer')}">
                Rescuer (<span th:text="${#lists.size(rescuers)}">0</span>)
            </a>
        </li>
    </ul>

    <!-- Tab content -->
    <div class="tab-content" id="accountTabsContent">

        <!-- Tab Victim -->
        <div class="tab-pane fade" th:classappend="${currentTab == 'victim'} ? 'show active'" id="victim-pane">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${victims}">
                            <td>
                                <a th:href="@{/admin/users/{id}(id=${v.id})}"
                                   class="text-decoration-none fw-semibold"
                                   th:text="${v.fullName}">
                                </a>
                            </td>
                            <td th:text="${v.email}"></td>
                            <td th:text="${v.phoneNumber}"></td>
                            <td>
                                <span th:if="${v.enabled}" class="badge text-bg-success">Hoạt động</span>
                                <span th:unless="${v.enabled}" class="badge text-bg-danger">Bị khóa</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/users/{id}(id=${v.id})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    Xem
                                </a>
                                <form th:action="@{/admin/users/victim/{id}/toggle(id=${v.id})}" method="post" class="d-inline">
                                    <button type="submit"
                                            th:class="${v.enabled}
                                                ? 'btn btn-sm btn-outline-danger'
                                                : 'btn btn-sm btn-outline-success'"
                                            th:text="${v.enabled} ? 'Khóa' : 'Mở khóa'">
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(victims)}">
                            <td colspan="5" class="text-center text-muted py-4">Chưa có tài khoản nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tab Rescuer -->
        <div class="tab-pane fade" th:classappend="${currentTab == 'rescuer'} ? 'show active'" id="rescuer-pane">

            <!-- Nút Chấp nhận tất cả ở đầu phần Rescuer -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted small">
                    Có <strong th:text="${pendingRescuerCount}">0</strong> tài khoản đang chờ duyệt
                </span>
                <form th:action="@{/admin/rescuers/approve-all}" method="post">
                    <button type="submit"
                            class="btn btn-success"
                            th:disabled="${pendingRescuerCount == 0}"
                            th:onclick="${pendingRescuerCount > 0} ? 'return confirm(\'Bạn có chắc muốn duyệt tất cả ' + ${pendingRescuerCount} + ' tài khoản Rescuer đang chờ?\')' : ''">
                        ✓ Chấp nhận tất cả (<span th:text="${pendingRescuerCount}">0</span>)
                    </button>
                </form>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${rescuers}" th:with="status=${@adminService.getRescuerStatus(r)}">
                            <td th:text="${r.fullName}"></td>
                            <td th:text="${r.email}"></td>
                            <td th:text="${r.phoneNumber}"></td>
                            <td>
                                <span th:if="${status == 'PENDING'}" class="badge text-bg-warning">Chờ duyệt</span>
                                <span th:if="${status == 'ACTIVE'}"  class="badge text-bg-success">Hoạt động</span>
                                <span th:if="${status == 'LOCKED'}"  class="badge text-bg-danger">Bị khóa</span>
                            </td>
                            <td class="text-center">
                                <!-- Nút Duyệt cho tài khoản Chờ duyệt -->
                                <form th:if="${status == 'PENDING'}"
                                      th:action="@{/admin/rescuers/{id}/approve(id=${r.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        Duyệt
                                    </button>
                                </form>

                                <!-- Nút Khóa cho tài khoản Hoạt động -->
                                <form th:if="${status == 'ACTIVE'}"
                                      th:action="@{/admin/users/rescuer/{id}/toggle(id=${r.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        Khóa
                                    </button>
                                </form>

                                <!-- Nút Mở khóa cho tài khoản Bị khóa -->
                                <form th:if="${status == 'LOCKED'}"
                                      th:action="@{/admin/users/rescuer/{id}/toggle(id=${r.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        Mở khóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rescuers)}">
                            <td colspan="5" class="text-center text-muted py-4">Chưa có tài khoản nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
