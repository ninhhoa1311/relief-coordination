<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">

    <h1 class="mb-4">Dashboard Admin</h1>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">

        <!-- Tổng yêu cầu -->
        <div class="col">
            <div class="card text-bg-dark h-100 shadow-sm">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.tong()}">0</div>
                    <div class="card-text mt-1">Tổng yêu cầu</div>
                </div>
            </div>
        </div>

        <!-- Đã gửi -->
        <div class="col">
            <div class="card text-bg-secondary h-100 shadow-sm">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.daDGui()}">0</div>
                    <div class="card-text mt-1">Đã gửi</div>
                </div>
            </div>
        </div>

        <!-- Đã tiếp nhận -->
        <div class="col">
            <div class="card text-bg-info h-100 shadow-sm">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.daTiepNhan()}">0</div>
                    <div class="card-text mt-1">Đã tiếp nhận</div>
                </div>
            </div>
        </div>

        <!-- Đang xử lý -->
        <div class="col">
            <div class="card text-bg-primary h-100 shadow-sm">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.dangXuLy()}">0</div>
                    <div class="card-text mt-1">Đang xử lý</div>
                </div>
            </div>
        </div>

        <!-- Hoàn thành -->
        <div class="col">
            <div class="card text-bg-success h-100 shadow-sm">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.hoanThanh()}">0</div>
                    <div class="card-text mt-1">Hoàn thành</div>
                </div>
            </div>
        </div>

        <!-- Đã xác nhận -->
        <div class="col">
            <div class="card h-100 shadow-sm" style="background-color:#198754;color:white;">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.daXacNhan()}">0</div>
                    <div class="card-text mt-1">Đã xác nhận</div>
                </div>
            </div>
        </div>

        <!-- Đã hủy -->
        <div class="col">
            <div class="card text-bg-danger h-100 shadow-sm">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.daHuy()}">0</div>
                    <div class="card-text mt-1">Đã hủy</div>
                </div>
            </div>
        </div>

        <!-- Số người đã nhận hỗ trợ -->
        <div class="col">
            <div class="card text-bg-warning h-100 shadow-sm">
                <div class="card-body text-center">
                    <div class="display-5 fw-bold" th:text="${stats.soNguoiDaNhanHoTro()}">0</div>
                    <div class="card-text mt-1">Số người đã nhận hỗ trợ</div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
