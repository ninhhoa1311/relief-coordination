<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            <!-- Flash alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
            </div>

            <!-- CARD TIẾN ĐỘ -->
            <div class="app-card mb-4">
                <h5 class="fw-bold text-navy mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-clock-history text-primary"></i>
                    <span>Tiến độ xử lý</span>
                </h5>

                <!-- Tiến độ dùng fragment chung -->
                <div th:replace="~{fragments/progress-steps :: steps(${request.status})}"></div>
            </div>

            <!-- CARD THÔNG TIN RESCUER (chỉ hiện khi đã tiếp nhận) -->
            <div th:if="${request.status.name() != 'SENT'}" class="rescuer-card">
                <div class="rescuer-card-title">
                    <i class="bi bi-shield-check text-primary fs-5"></i>
                    <span>Đội / Người cứu hộ phụ trách</span>
                </div>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <div class="text-muted small fw-semibold">Họ tên người cứu hộ:</div>
                        <div class="fs-6 fw-bold text-dark mt-1"
                             th:text="${request.rescuer != null ? request.rescuer.fullName : 'Đang phân công'}">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="text-muted small fw-semibold">Số điện thoại liên hệ:</div>
                        <div class="fs-6 fw-bold mt-1">
                            <a th:if="${request.rescuer != null && request.rescuer.phoneNumber != null}"
                               th:href="'tel:' + ${request.rescuer.phoneNumber}"
                               class="text-decoration-none text-primary d-inline-flex align-items-center gap-1">
                                <i class="bi bi-telephone-fill"></i>
                                <span th:text="${request.rescuer.phoneNumber}"></span>
                            </a>
                            <span th:if="${request.rescuer == null || request.rescuer.phoneNumber == null}" class="text-muted">Chưa có</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CARD THÔNG TIN CHÍNH -->
            <div class="app-card mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pb-3 mb-4 border-bottom">
                    <div>
                        <span class="text-muted small text-uppercase fw-bold letter-spacing-1">Yêu cầu cứu trợ</span>
                        <h4 class="mb-0 fw-bold text-navy" th:text="'#' + ${request.id}"></h4>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <th:block th:replace="~{fragments/urgency-badge :: badge(${request.urgencyLevel})}"></th:block>
                        <th:block th:replace="~{fragments/status-badge :: badge(${request.status})}"></th:block>
                    </div>
                </div>

                <div class="row g-3">
                    <!-- Địa điểm -->
                    <div class="col-12">
                        <div class="profile-field-label">Địa điểm cần cứu trợ</div>
                        <div class="fs-5 fw-bold text-dark" th:text="${request.location}"></div>
                        <div th:if="${request.hasLocation()}" class="mt-2 d-flex flex-wrap align-items-center gap-2">
                            <span class="gps-status-box has-location">
                                <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                                <span th:text="${request.latitude} + ', ' + ${request.longitude}"></span>
                            </span>
                            <a th:href="${request.mapUrl}" target="_blank" rel="noopener noreferrer"
                               class="btn btn-sm btn-outline-primary btn-pill">
                                <i class="bi bi-map me-1"></i> Mở trên Google Maps
                            </a>
                        </div>
                    </div>

                    <div class="col-12"><hr class="my-1 border-subtle"></div>

                    <!-- Nhu cầu & Số người -->
                    <div class="col-12 col-md-8">
                        <div class="profile-field-label">Loại nhu cầu cứu trợ</div>
                        <div>
                            <th:block th:replace="~{fragments/need-badges :: badges(${request.needTypes})}"></th:block>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="profile-field-label">Số người cần cứu</div>
                        <div class="fw-bold fs-5 text-dark" th:text="${request.numberOfPeople} + ' người'"></div>
                    </div>

                    <div class="col-12"><hr class="my-1 border-subtle"></div>

                    <!-- Mô tả -->
                    <div class="col-12">
                        <div class="profile-field-label">Mô tả chi tiết tình hình</div>
                        <div class="p-3 bg-light rounded-3 text-secondary" style="border: 1px solid var(--border-subtle); line-height: 1.6;"
                             th:text="${request.description != null && !request.description.isBlank()} ? ${request.description} : 'Không có mô tả bổ sung.'">
                        </div>
                    </div>

                    <!-- Thời gian -->
                    <div class="col-12 col-sm-6 text-muted small">
                        <i class="bi bi-calendar-event me-1"></i> Thời gian gửi:
                        <span class="fw-medium text-dark" th:text="${request.createdAt != null ? #temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></span>
                    </div>
                    <div class="col-12 col-sm-6 text-muted small text-sm-end">
                        <i class="bi bi-clock me-1"></i> Cập nhật lần cuối:
                        <span class="fw-medium text-dark" th:text="${request.updatedAt != null ? #temporals.format(request.updatedAt, 'dd/MM/yyyy HH:mm') : '-'}"></span>
                    </div>
                </div>
            </div>

            <!-- HÀNH ĐỘNG THEO TRẠNG THÁI -->
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 mb-4">
                <a th:href="@{/victim/home}" class="btn btn-outline-secondary btn-pill w-100 w-sm-auto order-2 order-sm-1">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                </a>

                <div class="d-flex flex-column flex-sm-row gap-2 w-100 w-sm-auto order-1 order-sm-2">
                    <!-- Sửa/Hủy chỉ khi status == SENT -->
                    <th:block th:if="${request.status.name() == 'SENT'}">
                        <a th:href="@{/victim/requests/{id}/edit(id=${request.id})}" class="btn btn-warning btn-pill w-100 w-sm-auto">
                            <i class="bi bi-pencil me-1"></i> Sửa yêu cầu
                        </a>
                        <form th:action="@{/victim/requests/{id}/cancel(id=${request.id})}" method="post"
                              onsubmit="return confirm('Bạn có chắc chắn muốn hủy yêu cầu cứu trợ này?');"
                              class="w-100 w-sm-auto">
                            <button type="submit" class="btn btn-danger btn-pill w-100">
                                <i class="bi bi-x-circle me-1"></i> Hủy yêu cầu
                            </button>
                        </form>
                    </th:block>

                    <!-- Xác nhận đã nhận khi status == COMPLETED -->
                    <th:block th:if="${request.status.name() == 'COMPLETED'}">
                        <form th:action="@{/victim/requests/{id}/confirm(id=${request.id})}" method="post"
                              onsubmit="return confirm('Xác nhận bạn đã nhận được cứu trợ đầy đủ từ đội cứu hộ?');"
                              class="w-100 w-sm-auto">
                            <button type="submit" class="btn btn-success btn-pill btn-lg w-100 shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i> Xác nhận đã nhận cứu trợ
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
