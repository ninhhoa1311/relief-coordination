<div th:fragment="content">
    <h2 th:text="${formTitle}">Tạo yêu cầu cứu trợ</h2>

    <form th:action="@{${formAction}}" th:object="${form}" method="post" class="mt-3" novalidate>

        <div class="mb-3">
            <label for="location" class="form-label">Địa điểm cần hỗ trợ *</label>
            <input type="text" id="location" th:field="*{location}" class="form-control"
                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                   placeholder="Số nhà, thôn/xã, huyện, tỉnh...">
            <div class="invalid-feedback" th:errors="*{location}"></div>
        </div>

        <div class="mb-3">
            <button type="button" id="btnGps" class="btn btn-outline-secondary btn-sm">
                📍 Lấy vị trí hiện tại
            </button>
            <span id="gpsStatus" class="ms-2 small text-muted"></span>
            <input type="hidden" id="latitude" th:field="*{latitude}">
            <input type="hidden" id="longitude" th:field="*{longitude}">
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="needType" class="form-label">Loại nhu cầu *</label>
                <select id="needType" th:field="*{needType}" class="form-select"
                        th:classappend="${#fields.hasErrors('needType')} ? 'is-invalid'">
                    <option value="">-- Chọn --</option>
                    <option th:each="n : ${needTypes}" th:value="${n}"
                            th:text="${T(com.reliefcoordination.relief_coordination.util.EnumLabels).need(n)}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{needType}"></div>
            </div>

            <div class="col-md-4 mb-3">
                <label for="numberOfPeople" class="form-label">Số người cần hỗ trợ *</label>
                <input type="number" id="numberOfPeople" th:field="*{numberOfPeople}" min="1"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('numberOfPeople')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{numberOfPeople}"></div>
            </div>

            <div class="col-md-4 mb-3">
                <label for="urgencyLevel" class="form-label">Mức độ khẩn cấp *</label>
                <select id="urgencyLevel" th:field="*{urgencyLevel}" class="form-select"
                        th:classappend="${#fields.hasErrors('urgencyLevel')} ? 'is-invalid'">
                    <option value="">-- Chọn --</option>
                    <option th:each="u : ${urgencyLevels}" th:value="${u}"
                            th:text="${T(com.reliefcoordination.relief_coordination.util.EnumLabels).urgency(u)}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{urgencyLevel}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Mô tả tình hình</label>
            <textarea id="description" th:field="*{description}" rows="4" class="form-control"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a class="btn btn-link" th:href="@{/victim/home}">Quay lại</a>
    </form>

    <script>
        // Lấy GPS MỘT LẦN khi người dùng bấm nút, không theo dõi liên tục.
        document.getElementById('btnGps').addEventListener('click', function () {
            var status = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                status.textContent = 'Trình duyệt không hỗ trợ định vị.';
                return;
            }
            status.textContent = 'Đang lấy vị trí...';
            navigator.geolocation.getCurrentPosition(function (pos) {
                document.getElementById('latitude').value = pos.coords.latitude;
                document.getElementById('longitude').value = pos.coords.longitude;
                status.textContent = 'Đã lấy vị trí: ' + pos.coords.latitude.toFixed(5)
                    + ', ' + pos.coords.longitude.toFixed(5);
            }, function () {
                status.textContent = 'Không lấy được vị trí. Vui lòng cho phép truy cập vị trí.';
            });
        });
    </script>
</div>
