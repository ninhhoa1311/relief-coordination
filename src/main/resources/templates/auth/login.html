<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập — Cần cứu trợ</title>

    <!-- Google Fonts: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- App Design System -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

    <div class="auth-container">
        <div class="app-card auth-card shadow-lg">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div th:replace="~{fragments/back-home :: backHome}"></div>
                <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-2 py-1 rounded-pill small">
                    Hệ thống cứu trợ
                </span>
            </div>

            <div class="text-center mb-4">
                <div class="app-icon-circle mx-auto mb-2" style="width: 54px; height: 54px; font-size: 1.4rem;">
                    <i class="bi bi-person-lock"></i>
                </div>
                <h2 class="h3 fw-bold text-navy mb-1" style="color: var(--color-navy);">Đăng nhập</h2>
                <p class="text-muted small mb-0">Truy cập tài khoản Cần cứu trợ của bạn</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 small rounded-3 mb-3" role="alert">
                <i class="bi bi-exclamation-circle-fill me-1"></i> Sai email hoặc mật khẩu.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small rounded-3 mb-3" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> Bạn đã đăng xuất thành công.
            </div>
            <div th:if="${success}" class="alert alert-success py-2 small rounded-3 mb-3" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${success}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Email đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="name@example.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-navy btn-pill w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <div class="mb-2">
                    <span class="text-muted small">Chưa có tài khoản?</span>
                    <a th:href="@{/register/victim}" class="fw-semibold text-danger small text-decoration-none">
                        Đăng ký (Tôi cần cứu trợ)
                    </a>
                </div>
                <div>
                    <span class="text-muted small">Bạn thuộc lực lượng cứu nạn?</span>
                    <a th:href="@{/register/rescuer}" class="fw-semibold text-primary small text-decoration-none">
                        Đăng ký Đội cứu hộ
                    </a>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
