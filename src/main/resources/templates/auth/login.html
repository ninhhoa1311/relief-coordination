<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dang nhap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card p-4" style="width: 400px;">
            <h3 class="mb-3 text-center">Dang nhap</h3>

            <div th:if="${param.error}" class="alert alert-danger">Sai email hoac mat khau.</div>
            <div th:if="${param.logout}" class="alert alert-success">Ban da dang xuat.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mat khau</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Dang nhap</button>
            </form>

            <div class="text-center mt-3">
                <span>Chưa có tài khoản?</span>
                <a th:href="@{/register/victim}">Đăng ký (Người cần cứu trợ)</a>
            </div>
            <div class="text-center mt-1">
                <small class="text-muted">Bạn là Rescuer?</small>
                <a th:href="@{/register/rescuer}"><small>Đăng ký tại đây</small></a>
            </div>
        </div>
    </div>
</body>
</html>
