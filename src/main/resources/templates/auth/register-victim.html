<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký — Người cần cứu trợ — Cần cứu trợ</title>

    <!-- Google Fonts: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- App Design System -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

    <div class="auth-container">
        <div class="app-card auth-card shadow-lg" style="max-width: 480px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div th:replace="~{fragments/back-home :: backHome}"></div>
                <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-2 py-1 rounded-pill small">
                    Người cần cứu trợ
                </span>
            </div>

            <div class="text-center mb-4">
                <div class="app-icon-circle app-icon-circle--red mx-auto mb-2" style="width: 54px; height: 54px; font-size: 1.4rem;">
                    <i class="bi bi-person-heart"></i>
                </div>
                <h2 class="h3 fw-bold mb-1" style="color: var(--color-navy);">Đăng ký tài khoản</h2>
                <p class="text-muted small mb-0">Dành cho người dân cần gửi và theo dõi yêu cầu cứu trợ</p>
            </div>

            <form th:action="@{/register/victim}" method="post" th:object="${registerForm}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Họ và tên <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" th:field="*{fullName}"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                               placeholder="Nguyễn Văn A" required autofocus>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Email liên hệ <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="name@example.com" required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Số điện thoại <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-telephone"></i></span>
                        <input type="tel" class="form-control border-start-0 ps-0" th:field="*{phoneNumber}"
                               th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                               placeholder="0912345678" required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               placeholder="Tối thiểu 6 ký tự" required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-check2-circle"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                               placeholder="Xác nhận lại mật khẩu" required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-danger btn-pill w-100 py-2 fw-bold">
                    <i class="bi bi-check-lg me-1"></i> Hoàn tất đăng ký
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">Đã có tài khoản?</span>
                <a th:href="@{/login}" class="fw-semibold text-primary small text-decoration-none">
                    Đăng nhập tại đây
                </a>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
