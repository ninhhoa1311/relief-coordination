<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle} ?: 'Cứu trợ thiên tai'">
        Cứu trợ thiên tai
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/home}">
            Cứu trợ thiên tai
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">

            <!-- Menu theo role: mỗi role sửa file nav-<role>.html của mình, KHÔNG sửa ở đây -->
            <th:block sec:authorize="hasRole('VICTIM')">
                <ul th:replace="~{fragments/nav-victim :: nav}"></ul>
            </th:block>
            <th:block sec:authorize="hasRole('RESCUER')">
                <ul th:replace="~{fragments/nav-rescuer :: nav}"></ul>
            </th:block>
            <th:block sec:authorize="hasRole('ADMIN')">
                <ul th:replace="~{fragments/nav-admin :: nav}"></ul>
            </th:block>

            <div class="d-flex align-items-center">
                <span class="navbar-text text-light me-3"
                      sec:authentication="name">
                </span>

                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            class="btn btn-outline-light btn-sm">
                        Đăng xuất
                    </button>
                </form>
            </div>

        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Nội dung từng trang được nhúng ở đây -->
    <div th:replace="~{${content} :: content}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
