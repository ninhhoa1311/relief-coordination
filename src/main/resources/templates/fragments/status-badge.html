<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="badge(status)" th:if="${status != null}" th:switch="${status.name()}">
    <span th:case="'SENT'" class="status-badge status-badge--sent">Đã gửi</span>
    <span th:case="'ACCEPTED'" class="status-badge status-badge--accepted">Đã tiếp nhận</span>
    <span th:case="'PROCESSING'" class="status-badge status-badge--processing">Đang xử lý</span>
    <span th:case="'COMPLETED'" class="status-badge status-badge--completed">Hoàn thành</span>
    <span th:case="'CONFIRMED'" class="status-badge status-badge--confirmed">Đã xác nhận</span>
    <span th:case="'CANCELLED'" class="status-badge status-badge--cancelled">Đã hủy</span>
</th:block>

</body>
</html>
