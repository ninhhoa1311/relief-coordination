<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
    <div th:replace="~{fragments/nav-admin :: nav}"></div>
    <div class="container">
        <table class="table table-bordered text-center">
            <thead class="table-dark"><tr><th>ID</th><th>Victim</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
                <tr th:each="r : ${requests}">
                    <td th:text="${r.id}"></td><td th:text="${r.victim.email}"></td><td th:text="${r.description}"></td>
                    <td th:text="${r.status.name()}"></td>
                    <td>
                        <form th:if="${r.status.name() == 'PENDING'}" th:action="@{/admin/requests/{id}/cancel(id=${r.id})}" method="post">
                            <button class="btn btn-sm btn-danger">Hủy</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
